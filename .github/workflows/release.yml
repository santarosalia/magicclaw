name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: x64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Build release bundle
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        shell: bash
        run: bash scripts/release/build-bundle.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/release/magicclaw-*.tar.gz
            dist/release/magicclaw-*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: dist/release
          pattern: bundle-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/release/

      - name: Prepare installer assets
        run: bash scripts/release/prepare-installer-assets.sh

      - name: Validate installer PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts, dist/installer-assets -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($err in $parseErrors) {
              $errors += "$($_.FullName):$($err.Extent.StartLineNumber):$($err.Extent.StartColumnNumber) $($err.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

          $ps51Traps = @(
            Select-String -Path scripts/lib/*.ps1, scripts/bin/*.ps1, scripts/install.ps1, dist/installer-assets/*.ps1 -Pattern '"[^"\r\n]*\\"\)' -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if ($ps51Traps.Count -gt 0) {
            $ps51Traps | ForEach-Object { Write-Error "PS 5.1 string terminator trap at $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

          $unicodeTraps = @(
            Select-String -Path scripts/lib/*.ps1, scripts/bin/*.ps1, scripts/install.ps1, dist/installer-assets/*.ps1 -Pattern '[\u2014\u2013]' -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if ($unicodeTraps.Count -gt 0) {
            $unicodeTraps | ForEach-Object { Write-Error "Replace Unicode dash with ASCII hyphen at $($_.Path):$($_.LineNumber)" }
            exit 1
          }

      - name: Test installer service helpers
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0
          $result = Invoke-Pester scripts/test/magicclaw-service.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/magicclaw-*.tar.gz
            dist/release/magicclaw-*.sha256
            dist/installer-assets/install.sh
            dist/installer-assets/install.ps1
            dist/installer-assets/magicclaw-github.ps1
            dist/installer-assets/magicclaw-service.ps1
          generate_release_notes: true
